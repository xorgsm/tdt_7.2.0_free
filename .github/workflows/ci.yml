name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Librerías de sistema que PySide6 necesita incluso en modo
      # "offscreen" (sin pantalla real). No se instala VLC a propósito:
      # player/vlc_player.py envuelve "import vlc" en try/except y
      # degrada con vlc=None si libvlc no está disponible -- exactamente
      # el caso de un runner de CI sin VLC instalado -- así que los
      # tests no lo necesitan para pasar.
      - name: Librerías de sistema para PySide6 (offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests + cobertura
        run: pytest --cov=core --cov=ui --cov=player --cov-report=term-missing -q
